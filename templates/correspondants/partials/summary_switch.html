{% load i18n %}
<button type="button" class="summary-switch {% if enabled %}on{% endif %}"
        role="switch" aria-checked="{{ enabled|yesno:'true,false' }}"
        title="{% if enabled %}{% trans 'Enabled' %}{% else %}{% trans 'Disabled' %}{% endif %}"
        hx-post="{{ toggle_url }}"
        hx-target="this"
        hx-swap="outerHTML">
</button>
