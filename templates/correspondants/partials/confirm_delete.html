{% load i18n %}
<form class="form-card"
      {% if capability %}
        method="post" action="{% url 'correspondants:capability_delete' correspondant_name name %}"
        hx-post="{% url 'correspondants:capability_delete' correspondant_name name %}"
      {% else %}
        method="post" action="{% url 'correspondants:correspondant_delete' name %}"
        hx-post="{% url 'correspondants:correspondant_delete' name %}"
      {% endif %}
      hx-target="#correspondant-list" hx-swap="innerHTML">
  {% csrf_token %}
  <h2>{% trans "Confirm deletion" %}</h2>
  <p>
    {% if capability %}
      {% blocktrans %}Delete capability {{ name }}?{% endblocktrans %}
    {% else %}
      {% blocktrans %}Delete correspondant {{ name }} and all its capabilities?{% endblocktrans %}
    {% endif %}
  </p>
  <div class="form-actions">
    <button type="submit" class="btn danger">{% trans "Delete" %}</button>
    <button type="button" class="btn secondary" @click="overlay = null">{% trans "Cancel" %}</button>
  </div>
</form>
