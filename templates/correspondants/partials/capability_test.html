{% load i18n %}
<form class="form-card"
      method="post"
      action="{% url 'correspondants:capability_test' correspondant_name capability_name %}"
      hx-post="{% url 'correspondants:capability_test' correspondant_name capability_name %}"
      hx-target="#overlay-content"
      hx-swap="innerHTML">
  {% csrf_token %}
  <h2>{% trans "Test capability" %} — {{ capability_name }}</h2>

  <label for="id_mail_input">{% trans "Mail to test (JSON or raw email)" %}</label>
  <textarea name="mail_input" id="id_mail_input" rows="10"
            placeholder='{"sender": "…", "object": "…", "body": "…"}'>{{ mail_input }}</textarea>

  <div class="form-actions">
    <button type="submit" class="btn">{% trans "Run the test" %}</button>
    <button type="button" class="btn secondary" @click="overlay = null">{% trans "Close" %}</button>
  </div>

  {% if error %}
    <div class="error-message">{{ error }}</div>
  {% endif %}
  {% if result %}
    <label>{% trans "Result" %}</label>
    <pre class="test-result">{{ result }}</pre>
  {% endif %}
</form>
