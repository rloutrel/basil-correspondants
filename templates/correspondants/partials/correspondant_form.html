{% load i18n %}
<form class="form-card"
      {% if correspondant %}
        method="post" action="{% url 'correspondants:correspondant_edit' correspondant.name %}"
        hx-post="{% url 'correspondants:correspondant_edit' correspondant.name %}"
      {% else %}
        method="post" action="{% url 'correspondants:correspondant_create' %}"
        hx-post="{% url 'correspondants:correspondant_create' %}"
      {% endif %}
      hx-target="#correspondant-list" hx-swap="innerHTML">
  {% csrf_token %}
  <h2>
    {% if correspondant %}
      {% trans "Edit correspondant" %}
    {% else %}
      {% trans "Add a correspondant" %}
    {% endif %}
  </h2>
  {{ form.as_p }}
  <div class="form-actions">
    <button type="submit" class="btn">{% trans "Save" %}</button>
    <button type="button" class="btn secondary" @click="overlay = null">{% trans "Cancel" %}</button>
  </div>
</form>
